<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background:#0F172A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#167D83" />
      <stop offset="100%" stop-color="#172B4D" />
    </linearGradient>
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#167D83" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Filters for drop shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Subtitle Banner -->
  <rect x="40" y="25" width="1120" height="75" rx="12" fill="url(#headerGrad)" filter="url(#shadow)" stroke="#334155" stroke-width="1"/>
  <text x="70" y="60" fill="#FFFFFF" font-size="22" font-weight="800" letter-spacing="0.5">EQUIFLOW — HIGH-LEVEL SYSTEM ARCHITECTURE</text>
  <text x="70" y="83" fill="#94A3B8" font-size="13" font-weight="500">Hexagonal Ports-and-Adapters Pattern • Role-Based Governance • Decoupled Mathematical Core • Dual Persistence</text>
  <rect x="990" y="47" width="140" height="28" rx="14" fill="#064E3B" stroke="#059669" stroke-width="1"/>
  <circle cx="1005" cy="61" r="5" fill="#34D399" />
  <text x="1018" y="65" fill="#A7F3D0" font-size="11" font-weight="700">PROD-READY v1.0</text>

  <!-- ========================================================================= -->
  <!-- LAYER 1: CLIENT & PRESENTATION LAYER (NEXT.JS 15 APP ROUTER) -->
  <!-- ========================================================================= -->
  <rect x="40" y="120" width="1120" height="155" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="120" width="1120" height="32" rx="12" fill="#0F172A" />
  <rect x="40" y="140" width="1120" height="12" fill="#0F172A" />
  <text x="60" y="142" fill="#38BDF8" font-size="12" font-weight="700" letter-spacing="1">1. PRESENTATION LAYER (Next.js 15 App Router + React 19 + Tailwind CSS)</text>

  <!-- View A: Emergency Coordinator -->
  <rect x="60" y="165" width="520" height="95" rx="8" fill="#0F172A" stroke="#167D83" stroke-width="1.5"/>
  <text x="80" y="190" fill="#2DD4BF" font-size="14" font-weight="700">EMERGENCY COORDINATOR VIEW (Default)</text>
  <text x="80" y="210" fill="#94A3B8" font-size="11">• Operational Mission Control & Real-time Flood Ward Map (Leaflet OSM)</text>
  <text x="80" y="228" fill="#94A3B8" font-size="11">• 2-Phase Constrained Supply Allocation & Human-in-the-Loop Review Gate</text>
  <text x="80" y="246" fill="#94A3B8" font-size="11">• Warehouse Inventory Shortage Forecast & Logistics Manifests (Read-Only)</text>

  <!-- View B: Administrator -->
  <rect x="620" y="165" width="520" height="95" rx="8" fill="#0F172A" stroke="#818CF8" stroke-width="1.5"/>
  <text x="640" y="190" fill="#A5B4FC" font-size="14" font-weight="700">ADMINISTRATOR GOVERNANCE HUB (/admin)</text>
  <text x="640" y="210" fill="#94A3B8" font-size="11">• MCDA 5-Factor Scoring Policy Calibration & Zod Weight Validation (Σ=100%)</text>
  <text x="640" y="228" fill="#94A3B8" font-size="11">• Warehouse Physical Stock Limits, Reserves & Fixed Humanitarian Units</text>
  <text x="640" y="246" fill="#94A3B8" font-size="11">• Personnel RBAC Directory, Cryptographic Audit Ledger & Baseline Reset</text>

