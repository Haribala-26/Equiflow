  <rect x="40" y="640" width="1120" height="100" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="640" width="1120" height="30" rx="12" fill="#0F172A" />
  <rect x="40" y="658" width="1120" height="12" fill="#0F172A" />
  <text x="60" y="661" fill="#60A5FA" font-size="12" font-weight="700" letter-spacing="1">4. REPOSITORY ABSTRACTION FACTORY (IRepository Contract — DATA_SOURCE Switcher)</text>

  <!-- Repo Adapter A: Mock -->
  <rect x="60" y="680" width="520" height="50" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="80" y="702" fill="#E2E8F0" font-size="12" font-weight="700">MockRepository (DATA_SOURCE="mock" - Default)</text>
  <text x="80" y="718" fill="#94A3B8" font-size="10.5">In-Memory Thread-Safe Store • Zero DB Dependency • Deterministic Chennai Baseline Seed</text>

  <!-- Repo Adapter B: Prisma -->
  <rect x="620" y="680" width="520" height="50" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="640" y="702" fill="#93C5FD" font-size="12" font-weight="700">PrismaRepository (DATA_SOURCE="prisma")</text>
  <text x="640" y="718" fill="#94A3B8" font-size="10.5">Prisma ORM 6.4 Client • PostgreSQL 16 Layer • Deterministic Migrations &amp; Seed Scripts</text>

  <!-- Connecting Arrow Down 4 -->
  <line x1="880" y1="740" x2="880" y2="765" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4,4" />
  <polygon points="880,772 874,762 886,762" fill="#38BDF8" />

  <!-- ========================================================================= -->
  <!-- LAYER 5: DATABASE & CLOUD INFRASTRUCTURE LAYER -->
  <!-- ========================================================================= -->
  <rect x="40" y="775" width="1120" height="100" rx="12" fill="#1E293B" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="775" width="1120" height="30" rx="12" fill="#0F172A" />
  <rect x="40" y="793" width="1120" height="12" fill="#0F172A" />
  <text x="60" y="796" fill="#34D399" font-size="12" font-weight="700" letter-spacing="1">5. INFRASTRUCTURE &amp; DATABASE PERSISTENCE</text>

  <!-- DB Box 1: ACID & Locking -->
