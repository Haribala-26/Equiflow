  <text x="75" y="836" fill="#E2E8F0" font-size="12" font-weight="700">ACID Transactions &amp; Locks</text>
  <text x="75" y="852" fill="#94A3B8" font-size="10">Prisma $transaction • Optimistic concurrency (version)</text>

  <!-- DB Box 2: Append-Only Ledger -->
  <rect x="425" y="815" width="345" height="48" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="440" y="836" fill="#E2E8F0" font-size="12" font-weight="700">Append-Only Audit Ledger</text>
  <text x="440" y="852" fill="#94A3B8" font-size="10">AuditEvent table • Immutable • Updates/deletes blocked</text>

  <!-- DB Box 3: Cloud & Docker Deployment -->
  <rect x="790" y="815" width="350" height="48" rx="6" fill="#0F172A" stroke="#059669" stroke-width="1"/>
  <text x="805" y="836" fill="#34D399" font-size="12" font-weight="700">Netlify Cloud &amp; Docker Compose</text>
  <text x="805" y="852" fill="#94A3B8" font-size="10">Live Web Service • Isolated PostgreSQL 16 Service Container</text>

</svg>