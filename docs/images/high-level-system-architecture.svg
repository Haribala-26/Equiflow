  <rect x="40" y="425" width="1120" height="32" rx="12" fill="#0F172A" />
  <rect x="40" y="445" width="1120" height="12" fill="#0F172A" />
  <text x="60" y="447" fill="#2DD4BF" font-size="12" font-weight="700" letter-spacing="1">3. CORE DOMAIN BUSINESS ENGINES (Pure Mathematical Models — Zero Database Imports)</text>

  <!-- Engine 1: Priority Engine -->
  <rect x="60" y="470" width="255" height="115" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="75" y="495" fill="#F8FAFC" font-size="13" font-weight="700">Priority Scoring Engine</text>
  <text x="75" y="515" fill="#94A3B8" font-size="10.5">• Multi-Criteria Decision (MCDA)</text>
  <text x="75" y="532" fill="#94A3B8" font-size="10.5">• Severity (30%), Urgency (25%)</text>
  <text x="75" y="549" fill="#94A3B8" font-size="10.5">• Vulnerability (20%), Unmet (15%)</text>
  <text x="75" y="566" fill="#94A3B8" font-size="10.5">• Log Population Cap (10%, 50k)</text>

  <!-- Engine 2: Allocation Engine -->
  <rect x="330" y="470" width="265" height="115" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="345" y="495" fill="#F8FAFC" font-size="13" font-weight="700">2-Phase Allocation Engine</text>
  <text x="345" y="515" fill="#94A3B8" font-size="10.5">• Phase 1: Anti-Starvation Floor (20%)</text>
  <text x="345" y="532" fill="#94A3B8" font-size="10.5">• Phase 2: Proportional Optimization</text>
  <text x="345" y="549" fill="#94A3B8" font-size="10.5">• Hamilton-Hare Largest Remainder</text>
  <text x="345" y="566" fill="#94A3B8" font-size="10.5">• Fixed Humanitarian Units Strictness</text>

  <!-- Engine 3: Responsible AI & Heuristics -->
  <rect x="610" y="470" width="260" height="115" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="625" y="495" fill="#F8FAFC" font-size="13" font-weight="700">Responsible AI Engine</text>
  <text x="625" y="515" fill="#94A3B8" font-size="10.5">• Google Gemini 2.5 Flash Parser</text>
  <text x="625" y="532" fill="#94A3B8" font-size="10.5">• Offline Keyword Heuristic Fallback</text>
  <text x="625" y="549" fill="#94A3B8" font-size="10.5">• Mandatory Human-in-the-Loop Sign-off</text>
  <text x="625" y="566" fill="#94A3B8" font-size="10.5">• Zero Direct Supply Dispatch Authority</text>

  <!-- Engine 4: Elephant-Goldfish & Simulations -->
  <rect x="885" y="470" width="255" height="115" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="900" y="495" fill="#F8FAFC" font-size="13" font-weight="700">Audit & Stress Engine</text>
  <text x="900" y="515" fill="#94A3B8" font-size="10.5">• Elephant-Goldfish Dual Memory</text>
  <text x="900" y="532" fill="#94A3B8" font-size="10.5">• Fresh-Eyes Automated Bias Checks</text>
  <text x="900" y="549" fill="#94A3B8" font-size="10.5">• What-If Disruption Simulations</text>
  <text x="900" y="566" fill="#94A3B8" font-size="10.5">• Supply Cutoffs (-30%) & Surges</text>

  <!-- Connecting Arrow Down 3 -->
  <line x1="600" y1="600" x2="600" y2="630" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4,4" />
  <polygon points="600,637 594,627 606,627" fill="#38BDF8" />

