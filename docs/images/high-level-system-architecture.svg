  <polygon points="600,312 594,302 606,302" fill="#38BDF8" />

  <!-- ========================================================================= -->
  <!-- LAYER 2: SECURITY & SESSION ENFORCEMENT GUARD (RBAC) -->
  <!-- ========================================================================= -->
  <rect x="40" y="315" width="1120" height="70" rx="10" fill="#1E293B" stroke="#E11D48" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="342" fill="#FB7185" font-size="12" font-weight="800" letter-spacing="1">2. SERVER-SIDE RBAC SECURITY & SESSION GUARD (src/lib/session.ts ──► src/lib/rbac.ts)</text>
  <text x="60" y="365" fill="#CBD5E1" font-size="11">
    • Cryptographic Session Cookie Resolution  • Typed Permission Matrix: <tspan fill="#F43F5E" font-weight="700">area:edit, allocation:approve, config:edit, admin:reset</tspan>  • Returns <tspan fill="#F43F5E" font-weight="700">HTTP 403 Forbidden</tspan> on unauthorized API access
  </text>

  <!-- Connecting Arrow Down 2 -->
  <line x1="600" y1="385" x2="600" y2="415" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4,4" />
  <polygon points="600,422 594,412 606,412" fill="#38BDF8" />

