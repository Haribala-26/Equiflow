services:
  db:
    image: postgres:16-alpine
    container_name: equiflow-postgres
    restart: always
    environment:
      POSTGRES_USER: equiflow
      POSTGRES_PASSWORD: equiflow_secure_password
      POSTGRES_DB: equiflow_db
    ports:
      - "5432:5432"
    volumes:
      - equiflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equiflow -d equiflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equiflow-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://equiflow:equiflow_secure_password@db:5432/equiflow_db?schema=public
      - DATA_SOURCE=prisma
      - SESSION_SECRET=equiflow_session_secret_32chars_demo
    depends_on:
      db:
        condition: service_healthy

volumes:
  equiflow_pgdata:
